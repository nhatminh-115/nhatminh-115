<text x="38" y="37" fill="#d4a75e" font-family="monospace" font-size="12" letter-spacing="2">01  /  COMPUTER VISION · REAL-TIME · HUMAN-IN-THE-LOOP MLOPS</text>
<text x="38" y="86" fill="#f0e4ca" font-family="Georgia,serif" font-size="39">SentinelVision</text>
<text x="38" y="119" fill="#d8c8a8" font-family="Arial,sans-serif" font-size="18">Multi-camera PPE monitoring: YOLO ensemble → ByteTrack → size-routed classifiers → parallel alerts.</text>
<text x="38" y="151" fill="#d8c8a8" font-family="Arial,sans-serif" font-size="18">Human-confirmed labels feed a drift-gated EfficientNet retraining and artifact-tracking loop.</text>
