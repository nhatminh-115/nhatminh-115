<text x="32" y="78" fill="#eee4d1" font-family="Georgia,serif" font-size="38">SentinelVision</text>
<text x="32" y="111" fill="#d0c8ba" font-family="Arial,sans-serif" font-size="17">Multi-camera PPE monitoring: YOLO ensemble → ByteTrack → size-routed classifiers → parallel alerts.</text>
<text x="32" y="139" fill="#d0c8ba" font-family="Arial,sans-serif" font-size="17">Human-confirmed labels feed a drift-gated EfficientNet retraining and artifact-tracking loop.</text>
