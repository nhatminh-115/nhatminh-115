<text x="38" y="86" fill="#f0e4ca" font-family="Georgia,serif" font-size="39">Patch-Content Fungibility</text>
<text x="38" y="119" fill="#d8c8b7" font-family="Arial,sans-serif" font-size="18">Investigating when late-layer spatial patch content can be replaced while positions, sequence and weights remain fixed.</text>
