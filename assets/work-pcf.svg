<text x="32" y="78" fill="#eee4d1" font-family="Georgia,serif" font-size="38">Patch-Content Fungibility</text>
<text x="32" y="111" fill="#d0c8ba" font-family="Arial,sans-serif" font-size="17">Investigating when late-layer spatial patch content can be replaced while positions, sequence and weights remain fixed.</text>
